<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Copy Branch Name</title>
  <desc id="desc">Two offset rounded sheets separated by a crisp transparent gap.</desc>
  <defs>
    <mask id="sheet-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <rect x="32" y="26" width="52" height="62" rx="11" fill="#000"/>
    </mask>
  </defs>
  <g fill="#ff6e40">
    <rect x="20" y="16" width="44" height="54" rx="7" mask="url(#sheet-gap)"/>
    <rect x="36" y="30" width="44" height="54" rx="7"/>
  </g>
</svg>
